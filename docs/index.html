<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ski Resort Snow Data - Powered by Grib Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .last-updated {
            margin-top: 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5rem;
            padding: 40px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px auto;
            max-width: 600px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .resort-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .resort-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .resort-header {
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .resort-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .resort-location {
            color: #666;
            font-size: 0.9rem;
        }

        .snow-metrics {
            display: grid;
            gap: 15px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .metric-label {
            font-weight: 500;
            color: #555;
        }

        .metric-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #667eea;
        }

        .metric-value.highlight {
            color: #4CAF50;
        }

        .metric-value.low {
            color: #ff9800;
        }

        .coordinates {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.85rem;
            color: #999;
        }

        .snow-icon {
            display: inline-block;
            margin-right: 5px;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .filter-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group label {
            font-weight: 600;
        }

        .filter-group select, .filter-group input {
            padding: 8px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .filter-group select:focus, .filter-group input:focus {
            border-color: #764ba2;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>❄️ Ski Resort Snow Data</h1>
            <div class="subtitle">Real-time snow conditions powered by Grib Stream Weather API</div>
            <div class="last-updated" id="lastUpdated">Loading...</div>
        </header>

        <div class="filters">
            <div class="filter-group">
                <label>Sort by:</label>
                <select id="sortBy">
                    <option value="name">Resort Name</option>
                    <option value="snowfall" selected>Snowfall (24h)</option>
                    <option value="depth">Snow Depth</option>
                    <option value="temperature">Temperature</option>
                </select>

                <label>Filter by State/Province:</label>
                <select id="filterState">
                    <option value="all">All Locations</option>
                </select>

                <label>Search:</label>
                <input type="text" id="searchInput" placeholder="Search resorts...">
            </div>
        </div>

        <div id="content">
            <div class="loading">Loading snow data...</div>
        </div>
    </div>

    <script>
        let allResorts = [];
        let filteredResorts = [];

        async function loadSnowData() {
            try {
                const response = await fetch('../data/latest.json');
                if (!response.ok) {
                    throw new Error('Data not yet available. Please wait for the first data collection.');
                }
                const data = await response.json();

                document.getElementById('lastUpdated').textContent =
                    `Last updated: ${new Date(data.timestamp).toLocaleString()}`;

                allResorts = data.resorts;
                populateStateFilter();
                applyFilters();

            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <h2>Unable to load data</h2>
                        <p>${error.message}</p>
                        <p>The first data collection will run automatically, or you can trigger it manually via GitHub Actions.</p>
                    </div>
                `;
            }
        }

        function populateStateFilter() {
            const states = [...new Set(allResorts.map(r => r.state))].sort();
            const stateFilter = document.getElementById('filterState');
            states.forEach(state => {
                const option = document.createElement('option');
                option.value = state;
                option.textContent = state;
                stateFilter.appendChild(option);
            });
        }

        function applyFilters() {
            const sortBy = document.getElementById('sortBy').value;
            const filterState = document.getElementById('filterState').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            // Filter
            filteredResorts = allResorts.filter(resort => {
                const matchesState = filterState === 'all' || resort.state === filterState;
                const matchesSearch = resort.name.toLowerCase().includes(searchTerm) ||
                                    resort.state.toLowerCase().includes(searchTerm);
                return matchesState && matchesSearch;
            });

            // Sort
            filteredResorts.sort((a, b) => {
                switch(sortBy) {
                    case 'name':
                        return a.name.localeCompare(b.name);
                    case 'snowfall':
                        return (b.snow.snowfall_inches || 0) - (a.snow.snowfall_inches || 0);
                    case 'depth':
                        return (b.snow.snow_depth_inches || 0) - (a.snow.snow_depth_inches || 0);
                    case 'temperature':
                        return (a.snow.temperature_f || 0) - (b.snow.temperature_f || 0);
                    default:
                        return 0;
                }
            });

            renderResorts();
        }

        function renderResorts() {
            const content = document.getElementById('content');

            if (filteredResorts.length === 0) {
                content.innerHTML = '<div class="error">No resorts match your filters.</div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'stats-grid';

            filteredResorts.forEach(resort => {
                const card = createResortCard(resort);
                grid.appendChild(card);
            });

            content.innerHTML = '';
            content.appendChild(grid);
        }

        function createResortCard(resort) {
            const card = document.createElement('div');
            card.className = 'resort-card';

            const snowfall = resort.snow.snowfall_inches || 0;
            const depth = resort.snow.snow_depth_inches || 0;
            const temp = resort.snow.temperature_f || 0;

            card.innerHTML = `
                <div class="resort-header">
                    <div class="resort-name">${resort.name}</div>
                    <div class="resort-location">${resort.state}, ${resort.country}</div>
                </div>
                <div class="snow-metrics">
                    <div class="metric">
                        <span class="metric-label"><span class="snow-icon">❄️</span> 24h Snowfall</span>
                        <span class="metric-value ${snowfall > 6 ? 'highlight' : snowfall > 2 ? '' : 'low'}">
                            ${snowfall.toFixed(1)}"
                        </span>
                    </div>
                    <div class="metric">
                        <span class="metric-label"><span class="snow-icon">🏔️</span> Snow Depth</span>
                        <span class="metric-value ${depth > 60 ? 'highlight' : ''}">
                            ${depth.toFixed(1)}"
                        </span>
                    </div>
                    <div class="metric">
                        <span class="metric-label"><span class="snow-icon">🌡️</span> Temperature</span>
                        <span class="metric-value">
                            ${temp.toFixed(1)}°F
                        </span>
                    </div>
                    <div class="metric">
                        <span class="metric-label"><span class="snow-icon">☁️</span> Snow Cover</span>
                        <span class="metric-value">
                            ${(resort.snow.snow_cover_percent || 0).toFixed(0)}%
                        </span>
                    </div>
                </div>
                <div class="coordinates">
                    📍 ${resort.coordinates.lat.toFixed(4)}°N, ${Math.abs(resort.coordinates.lon).toFixed(4)}°W
                </div>
            `;

            return card;
        }

        // Event listeners
        document.getElementById('sortBy').addEventListener('change', applyFilters);
        document.getElementById('filterState').addEventListener('change', applyFilters);
        document.getElementById('searchInput').addEventListener('input', applyFilters);

        // Load data on page load
        loadSnowData();
    </script>
</body>
</html>
